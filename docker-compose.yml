services:
  # MongoDB Service
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: userdb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  # Discovery Service
  discovery:
    build:
      context: ./services/discovery
    container_name: discovery-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - app-network

  # Gateway Service
  gateway:
    build:
      context: ./services/gateway
    container_name: gateway-service
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - DISCOVERY_URL=http://discovery:3000
    depends_on:
      - discovery
      - auth
      - cars
      - payment
      - reservation
    networks:
      - app-network

  # Auth Service
  auth:
    build:
      context: ./services/auth
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/userdb
      - JWT_SECRET=your_jwt_secret_key_change_this_in_production
      - JWT_EXPIRE=7d
      - DISCOVERY_URL=http://discovery:3000
      - SERVICE_URL=http://auth:3001
      # Email Configuration
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USER=jihedafli2017@gmail.com
      - EMAIL_PASSWORD=dcqlydtcopmgkjyw
      - EMAIL_FROM=jihedafli2017@gmail.com
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongodb
      - discovery
    networks:
      - app-network

  # Cars Service
  cars:
    build:
      context: ./services/cars
    container_name: cars-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - MONGODB_URI=mongodb://mongodb:27017/carsdb
      - JWT_SECRET=your_jwt_secret_key_change_this_in_production
      - DISCOVERY_URL=http://discovery:3000
      - SERVICE_URL=http://cars:3002
      - AUTH_SERVICE_URL=http://auth:3001
    depends_on:
      - mongodb
      - discovery
      - auth
    networks:
      - app-network

  # Payment Service
  payment:
    build:
      context: ./services/payment
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - MONGODB_URI=mongodb://mongodb:27017/paymentdb
      - JWT_SECRET=your_jwt_secret_key_change_this_in_production
      - DISCOVERY_URL=http://discovery:3000
      - SERVICE_URL=http://payment:3003
      - AUTH_SERVICE_URL=http://auth:3001
    depends_on:
      - mongodb
      - discovery
      - auth
    networks:
      - app-network

  # Reservation Service
  reservation:
    build:
      context: ./services/reservation
    container_name: reservation-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - MONGODB_URI=mongodb://mongodb:27017/reservationdb
      - JWT_SECRET=your_jwt_secret_key_change_this_in_production
      - DISCOVERY_URL=http://discovery:3000
      - SERVICE_URL=http://reservation:3004
      - AUTH_SERVICE_URL=http://auth:3001
      - CARS_SERVICE_URL=http://cars:3002
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USER=jihedafli2017@gmail.com
      - MAIL_PASS=dcqlydtcopmgkjyw
      - MAIL_FROM=Agence Location <jihedafli2017@gmail.com>
    volumes:
      - reservation_uploads:/app/uploads
    depends_on:
      - mongodb
      - discovery
      - auth
      - cars
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  reservation_uploads:
    driver: local
